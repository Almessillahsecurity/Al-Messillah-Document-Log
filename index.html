<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
<title>Guardhouse Document Log</title>
<style>
:root{--bg:#f3f1ec;--card:#fff;--tx:#1d2125;--mu:#5c6670;--ln:#d8d4ca;--sign:#1b4f8f;--signtx:#fff;--pen:#b45f06;--pent:#fdf0dc;--ok:#1a7f37;--okt:#e3f4e8;--bad:#b3261e;--ac:#1b4f8f;--act:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14181b;--card:#1e2327;--tx:#ecebe6;--mu:#9aa5ad;--ln:#323a40;--sign:#3b7dd8;--pen:#f0a24a;--pent:#33271a;--ok:#5fd085;--okt:#17301f;--bad:#ff8a80;--ac:#3b7dd8}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14181b;--card:#1e2327;--tx:#ecebe6;--mu:#9aa5ad;--ln:#323a40;--sign:#3b7dd8;--pen:#f0a24a;--pent:#33271a;--ok:#5fd085;--okt:#17301f;--bad:#ff8a80;--ac:#3b7dd8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 40px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:10px 0 8px;border-bottom:1px solid var(--ln)}
h1{font-size:17px;margin:0 0 6px}
.who{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mu)}
.who select{flex:1;margin:0}
.who button{padding:6px 10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:8px;font-size:14px}
nav{display:flex;gap:6px;margin-top:8px}
nav button{flex:1;padding:8px 4px;font-size:14px;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:8px}
nav button.on{background:var(--ac);color:var(--act);border-color:var(--ac);font-weight:600}
input,select,button{font:inherit;color:var(--tx)}
input,select{width:100%;box-sizing:border-box;padding:9px;border:1px solid var(--ln);border-radius:8px;background:var(--card);margin:3px 0 8px}
label{font-size:13px;color:var(--mu)}
.btn{display:block;width:100%;padding:10px;border:0;border-radius:8px;background:var(--ac);color:var(--act);font-weight:600;font-size:15px}
.btn.alt{background:transparent;color:var(--tx);border:1px solid var(--ln);font-weight:500}
.btn.sm{display:inline-block;width:auto;padding:7px 12px;font-size:13px}
.sign{background:var(--sign);color:var(--signtx);font-size:18px;font-weight:700;padding:5px 12px;border-radius:6px;margin:14px 0 6px;display:flex;justify-content:space-between;align-items:center}
.sign span{font-size:12px;font-weight:500;opacity:.9}
.card{background:var(--card);border:1px solid var(--ln);border-left:6px solid var(--pen);border-radius:8px;padding:9px 10px;margin-bottom:6px}
.card.done{border-left-color:var(--ok)}.card.void{border-left-color:var(--mu);opacity:.7}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.villa{font-size:17px;font-weight:700}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--pent);color:var(--pen);white-space:nowrap}
.card.done .tag{background:var(--okt);color:var(--ok)}
.mu{color:var(--mu);font-size:13px}
.panel{margin-top:8px;padding-top:8px;border-top:1px dashed var(--ln)}
.row{display:flex;gap:8px;margin-top:6px}.row .btn{flex:1}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.sum div{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:7px;text-align:center;font-size:12px;color:var(--mu)}
.sum b{display:block;font-size:20px;color:var(--tx)}
.log{font-size:12px;color:var(--bad);margin-top:4px}
.empty{padding:28px 8px;text-align:center;color:var(--mu)}
#toast{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:532px;margin:0 auto;background:var(--tx);color:var(--bg);padding:10px 12px;border-radius:8px;display:none;z-index:20;font-size:14px}
.note{font-size:12px;color:var(--mu);margin-top:18px}
</style></head><body>
<div class="wrap" id="app"></div><div id="toast"></div>
<script>
var API="https://script.google.com/macros/s/AKfycbyPTUY0_VJI_dpPvVMHNwJfswSRa7XvmLGO41JdbAzCPBRh4eDDFMjn8McEH_kWhN6o/exec";
var STREETS=["Mecca","Damascus","Sunset","Beirut","Casablanca","Eastern","Western","Agadir"];
var D=[],G=[],me="",pin="",tab="wait",q="",openId=null,fl="All",busy=false,loaded=false,failed=false,tt;
try{me=localStorage.getItem("gl_me")||"";pin=localStorage.getItem("gl_pin")||""}catch(e){}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.style.display="block";clearTimeout(tt);tt=setTimeout(function(){t.style.display="none"},2600)}
function opts(a,sel){return a.map(function(x){return'<option'+(x===sel?" selected":"")+'>'+esc(x)+'</option>'}).join("")}
function v(i){var x=document.getElementById(i);return x?x.value.trim():""}
function call(action,extra,quiet){
 busy=true;if(!quiet)toast("Saving…");
 var p=Object.assign({action:action,pin:pin,guard:me},extra||{});
 return fetch(API,{method:"POST",body:JSON.stringify(p)}).then(function(r){return r.json()}).then(function(j){
  busy=false;
  if(!j.ok){if(j.error==="pin"){pin="";loaded=false;try{localStorage.removeItem("gl_pin")}catch(e){}render();toast("Wrong or changed PIN.")}else toast("Problem: "+j.error);return false}
  D=j.docs;G=j.guards;loaded=true;failed=false;return true
 }).catch(function(){busy=false;failed=true;toast("No connection. Nothing was saved.");return false})}
function act(action,extra,msg){if(busy)return;call(action,extra).then(function(ok){render();if(ok)toast(msg)})}
function find(id){return D.filter(function(d){return d.id===id})[0]}
function card(d,hist){
 var c=d.status==="Pending"?"":d.status==="Voided"?" void":" done",h='<div class="card'+c+'"><div class="top"><span class="villa">'+esc(d.street)+" "+esc(d.villa)+'</span><span class="tag">'+(hist?esc(d.status):esc(d.type))+'</span></div>';
 h+='<div>'+esc(d.tenant)+(hist?" · "+esc(d.type):"")+'</div><div class="mu">Given by '+esc(d.givenBy)+" to "+esc(d.receivedBy)+", "+esc(d.receivedAt)+"</div>";
 if(d.doneAt)h+='<div class="mu">'+esc(d.status)+": "+esc(d.collectedBy)+(d.handedBy?", handed by "+esc(d.handedBy):"")+", "+esc(d.doneAt)+"</div>";
 d.log.forEach(function(l){h+='<div class="log">'+esc(l)+"</div>"});
 if(!hist&&openId===d.id){h+='<div class="panel"><label>Who collected it?</label><select id="cb"><option>Sir</option><option>Madam</option><option>Other (instructed)</option></select><input id="co" placeholder="Name or note if Other"><div class="row"><button class="btn" data-a="hand" data-id="'+d.id+'">Handed out</button><button class="btn alt" data-a="close">Cancel</button></div></div>'}
 else if(!hist){h+='<div class="row"><button class="btn sm" data-a="open" data-id="'+d.id+'">Hand out</button><button class="btn sm alt" data-a="office" data-id="'+d.id+'">Collected at office</button></div>'}
 if(hist&&(d.status==="Delivered"||d.status==="Collected at office"))h+='<div class="row"><button class="btn sm alt" data-a="undo" data-id="'+d.id+'">Undo</button></div>';
 if(hist&&d.status==="Pending")h+='<div class="row"><button class="btn sm alt" data-a="void" data-id="'+d.id+'">Entered by mistake</button></div>';
 return h+"</div>"}
function render(){
 var a=document.getElementById("app");
 if(!loaded){
  if(pin&&!failed){a.innerHTML='<h1 style="padding-top:40px">Guardhouse Document Log</h1><div class="empty">Loading…</div>';return}
  if(pin&&failed){a.innerHTML='<h1 style="padding-top:40px">Guardhouse Document Log</h1><div class="empty">Could not connect.</div><button class="btn" data-a="retry">Try again</button>';return}
  a.innerHTML='<h1 style="padding-top:40px">Guardhouse Document Log</h1><label>Enter the PIN to open</label><input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN"><button class="btn" data-a="unlock">Open</button>';return}
 var h='<header><h1>Guardhouse Document Log</h1><div class="who">I am<select id="me"><option value="">Pick your name</option>'+opts(G,me)+'</select><button data-a="refresh" aria-label="Refresh">↻</button></div><nav>';
 [["wait","Waiting"],["add","Add"],["hist","Records"]].forEach(function(t){h+='<button data-a="tab" data-id="'+t[0]+'" class="'+(tab===t[0]?"on":"")+'">'+t[1]+"</button>"});
 h+="</nav></header>";
 if(!G.length)h+='<div class="empty">No guard names yet. Open Records and add the guard names first.</div>';
 if(tab==="add"){h+='<h2>New document</h2><label>Street</label><select id="st">'+opts(STREETS)+'</select><label>Villa number</label><input id="vi" inputmode="numeric"><label>Tenant name</label><input id="tn"><label>Document type</label><select id="ty"><option>Tenancy agreement</option><option>Rent receipt</option></select><label>Given by (management staff)</label><input id="gb"><button class="btn" data-a="add">Save as waiting</button>'}
 else if(tab==="wait"){
  h+='<input id="q" placeholder="Search villa, street or name" value="'+esc(q)+'" style="margin-top:12px">';
  var any=false;
  STREETS.forEach(function(s){
   var L=D.filter(function(d){return d.status==="Pending"&&d.street===s&&q.toLowerCase().split(/\s+/).filter(Boolean).every(function(w){return(d.villa+" "+d.street+" "+d.tenant).toLowerCase().indexOf(w)>-1})});
   if(!L.length)return;any=true;
   h+='<div class="sign">'+s+"<span>"+L.length+" waiting</span></div>";
   L.forEach(function(d){h+=card(d,false)})});
  if(!any)h+='<div class="empty">Nothing waiting. Tap Add when management brings documents.</div>'}
 else{
  var c={Pending:0,Delivered:0,"Collected at office":0};
  D.forEach(function(d){if(c[d.status]!==undefined)c[d.status]++});
  h+='<div class="sum"><div><b>'+c.Pending+'</b>Waiting</div><div><b>'+c.Delivered+'</b>Handed out</div><div><b>'+c["Collected at office"]+'</b>At office</div></div>';
  h+='<select id="fl">'+opts(["All","Pending","Delivered","Collected at office","Voided"],fl)+"</select>";
  var L=D.filter(function(d){return fl==="All"||d.status===fl}).slice().reverse();
  if(!L.length)h+='<div class="empty">No records yet.</div>';
  L.forEach(function(d){h+=card(d,true)});
  h+='<h2>Guard names</h2>'+G.map(function(g,i){return'<div class="row" style="align-items:center"><span style="flex:1">'+esc(g)+'</span><button class="btn sm alt" data-a="delg" data-id="'+i+'">Remove</button></div>'}).join("")+'<input id="gn" style="margin-top:12px" placeholder="Add a guard first name"><button class="btn alt" data-a="addg">Add name</button><div class="note">All records are saved in the shared Google Sheet.</div>'}
 a.innerHTML=h}
function load(quiet){return call("list",{},quiet).then(function(ok){render();return ok})}
document.addEventListener("click",function(e){
 var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a,id=b.dataset.id;
 if(a==="unlock"){var p=v("pin");if(!p){toast("Type the PIN.");return}pin=p;call("list",{},true).then(function(ok){if(ok){try{localStorage.setItem("gl_pin",pin)}catch(x){}}render()});return}
 if(a==="retry"||a==="refresh"){load(true);return}
 if(a==="tab"){tab=id;openId=null;render();return}
 if(a==="open"){openId=id;render();return}
 if(a==="close"){openId=null;render();return}
 if(a==="addg"){var n=v("gn");if(!n){toast("Type a name first.");return}act("addGuard",{name:n},"Name added.");return}
 if(a==="delg"){act("removeGuard",{name:G[+id]},"Name removed. Past records keep it.");return}
 if(!me){toast("Pick your name at the top first.");return}
 if(a==="add"){
  var vi=v("vi"),tn=v("tn"),gb=v("gb");if(!vi||!tn||!gb){toast("Fill in villa, tenant and who gave it.");return}
  if(busy)return;tab="wait";call("add",{street:v("st"),villa:vi,tenant:tn,type:v("ty"),givenBy:gb}).then(function(ok){if(!ok)tab="add";render();if(ok)toast("Saved. It is now waiting.")});return}
 if(a==="hand"){var cb=v("cb"),co=v("co");if(cb.indexOf("Other")===0&&!co){toast("Write who collected it.");return}openId=null;act("hand",{id:id,collectedBy:cb.indexOf("Other")===0?co:cb},"Marked as handed out.");return}
 if(a==="office"){act("office",{id:id},"Marked as collected at office.");return}
 if(a==="undo"){act("undo",{id:id},"Back on the waiting list.");return}
 if(a==="void"){act("void",{id:id},"Entry voided. It stays in the records.")}
});
document.addEventListener("change",function(e){
 if(e.target.id==="me"){me=e.target.value;try{localStorage.setItem("gl_me",me)}catch(x){}}
 if(e.target.id==="fl"){fl=e.target.value;render()}});
document.addEventListener("input",function(e){
 if(e.target.id==="q"){q=e.target.value;var p=e.target.selectionStart;render();var n=document.getElementById("q");n.focus();n.setSelectionRange(p,p)}});
setInterval(function(){var t=document.activeElement&&document.activeElement.tagName;if(loaded&&!busy&&!openId&&tab!=="add"&&t!=="INPUT"&&t!=="SELECT")load(true)},30000);
render();if(pin)load(true);
</script></body></html>
